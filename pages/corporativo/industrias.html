<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrias | DEMATIQ</title>
  <link href="../../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">
</head>
<body>

<!-- Header insertado por JS -->

<!-- ═══════════ HERO ═══════════ -->
<section class="page-hero">
  <div class="page-hero-inner">
    <p class="page-hero-tag">Sectores</p>
    <h1>Industrias</h1>
    <p>Trabajamos con los principales sectores industriales, aportando tecnología y experiencia en cada proyecto.</p>
  </div>
</section>

<!-- ═══════════ INDUSTRIAS ═══════════ -->
<section class="page-section">
  <div class="container">
    <h2 class="section-title">Industrias con las que trabajamos</h2>

    <div class="industrias-grid">

      <!-- Lista lateral -->
      <div class="industrias-lista-wrap">
        <ul class="lista-industrias list-unstyled" id="listaIndustrias"></ul>
      </div>

      <!-- Panel de contenido -->
      <div id="infoContainer"></div>
    </div><!-- /industrias-grid -->
  </div>
</section>

<script src="../../assets/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/components/header.js"></script>
<script src="../../assets/js/components/footer.js"></script>
<script>
function mostrarIndustria(id, item) {
  document.querySelectorAll('.info-industria').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.lista-industrias li').forEach(li => li.classList.remove('active'));
  document.getElementById(id).style.display = 'block';
  item.classList.add('active');
  if (window.innerWidth < 769)
    document.getElementById('infoContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

(async function() {
  try {
    const industrias = await fetch('/api/contenido.php?clave=industrias').then(r => r.json());
    if (!industrias || !industrias.length) return;

    const lista = document.getElementById('listaIndustrias');
    const info  = document.getElementById('infoContainer');

    lista.innerHTML = industrias.map((ind, i) =>
      `<li onclick="mostrarIndustria('ind-${ind.id}',this)"${i===0?' class="active"':''}>${ind.nombre}</li>`
    ).join('');

    info.innerHTML = industrias.map((ind, i) => `
      <div id="ind-${ind.id}" class="info-industria" style="display:${i===0?'block':'none'}">
        <h3>${ind.nombre}</h3>
        <p>${ind.descripcion}</p>
        <div class="carousel slide" data-bs-ride="carousel" data-bs-interval="2500">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="../../assets/images/general/img1.png" class="d-block w-100" alt="${ind.nombre}"></div>
            <div class="carousel-item"><img src="../../assets/images/general/img2.png" class="d-block w-100" alt="${ind.nombre}"></div>
          </div>
        </div>
      </div>`
    ).join('');
  } catch(e) {}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrias | DEMATIQ</title>
  <meta name="description" content="Conoce las industrias que atiende DEMATIQ con soluciones de automatización y maquinaria industrial especializada a la medida.">
  <link rel="canonical" href="https://dematiq.com.mx/pages/corporativo/industrias.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DEMATIQ">
  <meta property="og:locale" content="es_MX">
  <meta property="og:url" content="https://dematiq.com.mx/pages/corporativo/industrias.html">
  <meta property="og:title" content="Industrias | DEMATIQ">
  <meta property="og:description" content="Conoce las industrias que atiende DEMATIQ con soluciones de automatización y maquinaria industrial especializada.">
  <meta property="og:image" content="https://dematiq.com.mx/assets/images/logos/DEMATIQ_logo_blanco_fondo_azul.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Industrias | DEMATIQ">
  <meta name="twitter:description" content="Industrias que atiende DEMATIQ con soluciones de automatización y maquinaria a la medida.">
  <meta name="twitter:image" content="https://dematiq.com.mx/assets/images/logos/DEMATIQ_logo_blanco_fondo_azul.webp">
  <link href="../../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css?v=28">
  <link rel="icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">
</head>
<body>

<!-- Header insertado por JS -->

<!-- ═══════════ HERO ═══════════ -->
<section class="page-hero svc-hero-compact">
  <div class="page-hero-inner">
    <p class="page-hero-tag">Sectores</p>
    <h1>Industrias con las que trabajamos</h1>
  </div>
</section>

<!-- ═══════════ INDUSTRIAS ═══════════ -->

<!-- Pills solo visibles en mobile (las llena el JS) -->
<div class="ind-pills-wrap">
  <div class="ind-pills"></div>
</div>

<section class="svc-explorer ind-explorer">
  <aside class="svc-optionlist">
    <div class="svc-optionlist-sticky">
      <p class="svc-optionlist-head">Sectores</p>
      <!-- Botones de sectores: los llena el JS -->
    </div>
  </aside>
  <div class="svc-content-wrap">
    <!-- Paneles de industria: los llena el JS -->
    <div id="infoContainer"></div>
  </div>
</section>

<script src="../../assets/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/components/header.js"></script>
<script src="../../assets/js/components/footer.js"></script>
<script src="../../assets/js/components/industrias-data.js"></script>

<script>
  // Cambiar de sector desde el sidebar
  function mostrarIndustria(id, item) {
    document.querySelectorAll('.info-industria').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.svc-optionlist .svc-option').forEach(b => b.classList.remove('active'));
    const panel = document.getElementById(id);
    if (panel) panel.style.display = 'block';
    if (item) item.classList.add('active');
  }

  // Cambiar de sector desde los pills (mobile)
  function mostrarIndustriaPill(id, pill) {
    document.querySelectorAll('.info-industria').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.ind-pill').forEach(b => b.classList.remove('active'));
    const panel = document.getElementById(id);
    if (panel) panel.style.display = 'block';
    if (pill) { pill.classList.add('active'); pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }
  }

  (function () {
    const DATA      = (window.DEMATIQ_INDUSTRIAS || []).slice();
    const pillsWrap = document.querySelector('.ind-pills');
    const sidebar   = document.querySelector('.svc-optionlist-sticky');
    const container = document.getElementById('infoContainer');
    const txt = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // Un subtema = nombre + descripción, siempre visible (sin abrir/cerrar)
    function subItem(item) {
      return `<div class="ind-sub">
        <h5 class="ind-sub-name">${txt(item.n)}</h5>
        <p class="ind-sub-desc">${txt(item.d)}</p>
      </div>`;
    }

    function panelHTML(ind, i) {
      const areas = (ind.areas || []).map(subItem).join('');
      const temas = (ind.temas || []).map(subItem).join('');
      const img1  = ind.imagen1 ? '../../' + txt(ind.imagen1) : '../../assets/images/general/img1.webp';
      const img2  = ind.imagen2 ? '../../' + txt(ind.imagen2) : '../../assets/images/general/img2.webp';
      return `<div id="${txt(ind.id)}" class="info-industria"${i === 0 ? ' style="display:block;"' : ''}>
        <h3>${txt(ind.nombre)}</h3>
        <p class="ind-intro">${txt(ind.intro)}</p>
        <div class="carousel2" data-idx="0">
          <div class="c2-track">
            <img src="${img1}" alt="${txt(ind.nombre)}">
            <img src="${img2}" alt="${txt(ind.nombre)}">
          </div>
          <div class="c2-dots"><span class="active" data-i="0"></span><span data-i="1"></span></div>
        </div>
        <div class="ind-groups">
          <div class="ind-group">
            <h4 class="ind-group-title">Áreas de planta</h4>
            <div class="ind-sub-list">${areas}</div>
          </div>
          <div class="ind-group">
            <h4 class="ind-group-title">Temas técnicos</h4>
            <div class="ind-sub-list">${temas}</div>
          </div>
        </div>
      </div>`;
    }

    function initCarousels() {
      document.querySelectorAll('.info-industria .carousel2').forEach(function (c) {
        var track = c.querySelector('.c2-track'); if (!track) return;
        var count = track.children.length;
        var dots = c.querySelectorAll('.c2-dots span');
        var idx = 0, timer = null;
        function go(i) { idx = (i + count) % count; c.dataset.idx = idx; track.style.transform = 'translateX(-' + (idx * 100) + '%)';
          dots.forEach(function (d, k) { d.classList.toggle('active', k === idx); }); }
        function stop() { if (timer) { clearInterval(timer); timer = null; } }
        function start() { stop(); if (count > 1) timer = setInterval(function () { go(idx + 1); }, 3000); }
        dots.forEach(function (d, k) { d.addEventListener('click', function () { go(k); start(); }); });
        c.addEventListener('mouseenter', stop);
        c.addEventListener('mouseleave', start);
        start();
      });
    }

    function renderAll(list) {
      if (pillsWrap) {
        pillsWrap.innerHTML = '';
        list.forEach((ind, i) => {
          const pill = document.createElement('button');
          pill.className = 'ind-pill' + (i === 0 ? ' active' : '');
          pill.textContent = ind.nombre || '';
          pill.addEventListener('click', () => mostrarIndustriaPill(ind.id, pill));
          pillsWrap.appendChild(pill);
        });
      }
      if (sidebar) {
        const head = sidebar.querySelector('.svc-optionlist-head');
        sidebar.innerHTML = '';
        if (head) sidebar.appendChild(head);
        list.forEach((ind, i) => {
          const b = document.createElement('button');
          b.className = 'svc-option' + (i === 0 ? ' active' : '');
          b.onclick = function () { mostrarIndustria(ind.id, this); };
          b.innerHTML = `<span class="svc-option-name">${txt(ind.nombre)}</span>`;
          sidebar.appendChild(b);
        });
      }
      if (container) container.innerHTML = list.map(panelHTML).join('');
      initCarousels();
    }

    renderAll(DATA);
    document.querySelector('.svc-explorer')?.classList.add('svc-ready');

    // Sincroniza nombre/intro desde la BD si existe, conservando áreas y temas locales
    (async function () {
      try {
        const db = await fetch('/api/contenido.php?clave=industrias', { cache: 'no-store' }).then(r => r.json());
        if (!Array.isArray(db) || !db.length) return;
        const byId = Object.fromEntries(DATA.map(d => [d.id, d]));
        const merged = db.map(row => {
          const local = byId[row.id] || { areas: [], temas: [] };
          return {
            id: row.id,
            nombre: row.nombre || local.nombre || '',
            intro: row.descripcion || local.intro || '',
            imagen1: row.imagen1 || '',
            imagen2: row.imagen2 || '',
            areas: (Array.isArray(row.areas) && row.areas.length) ? row.areas : (local.areas || []),
            temas: (Array.isArray(row.temas) && row.temas.length) ? row.temas : (local.temas || [])
          };
        });
        renderAll(merged);
      } catch (e) { /* fallo silencioso — queda el contenido local */ }
    })();
  })();
</script>
</body>
</html>

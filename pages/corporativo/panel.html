<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DEMATIQ | Editar Proyecto</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f7;
    }

    /* NAVBAR */
    .navbar {
        background-color: #0d6efd;
        padding: 15px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* CONTENEDOR */
    .container {
        padding: 30px;
        max-width: 700px;
        margin: auto;
    }

    h2 {
        font-size: 26px;
        color: #333;
        margin-bottom: 20px;
        font-weight: bold;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        margin-top: 15px;
    }

    input, textarea, select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #bbb;
    }

    textarea {
        height: 100px;
    }

    /* BOTÓN GUARDAR */
    .btn-save {
        margin-top: 25px;
        background-color: #0d6efd;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
    }

    .btn-save:hover {
        background-color: #0b5ed7;
    }

    /* IMAGEN ACTUAL */
    .preview-box {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin-top: 10px;
        display: flex;
        gap: 15px;
        align-items: center;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .preview-box img {
        width: 120px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

</style>
  <link rel="icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div style="font-size:20px; font-weight:bold;">DEMATIQ | Editar Proyecto</div>
    <div><a style="color:white; text-decoration:none;">Regresar</a></div>
</div>

<!-- CONTENIDO -->
<div class="container">
    <h2>Editar Proyecto</h2>

    <label>Título del proyecto</label>
    <input type="text" value="Sistema de Ensamble Automático">

    <label>Descripción</label>
    <textarea>Equipo automatizado para mejorar tiempos de producción.</textarea>

    <label>Estado</label>
    <select>
        <option selected>Activo</option>
        <option>Inactivo</option>
    </select>

    <label>Imagen actual</label>

    <div class="preview-box">
        <img src="../../assets/images/general/img1.webp" alt="Imagen actual">
        <div style="color:#333;">
            Esta es la imagen actualmente asociada al proyecto.
        </div>
    </div>

    <label>Subir nueva imagen (opcional)</label>
    <input type="file">

    <button class="btn-save">Actualizar Proyecto</button>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensamble | DEMATIQ</title>

  <link href="../../assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">

  <link rel="icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">
</head>
<body>

  <!-- Header inserted by JS -->

  <section class="page-hero">
    <div class="page-hero-inner">
      <p class="page-hero-tag">Soluciones</p>
      <h1>Máquinas de Marcado</h1>
    </div>
  </section>

  <!-- Sección Soluciones -->
   <section class="seccion-soluciones">
    <h2>Soluciones y Servicios</h2>
    <div class="botones-soluciones">
      <a href="../servicios/servicios.html"><button class="btn-solucion">Servicios</button></a>
      <a href="../ensamble/ensamble.html"><button class="btn-solucion">Ensamble</button></a>
      <a href="../maquinas/maqcontrol.html"><button class="btn-solucion">Torque</button></a>
      <a href="../maquinas/maqprob.html"><button class="btn-solucion">Fuga</button></a>
      <a href="../maquinas/maqinspe.html"><button class="btn-solucion">Inspección</button></a>
      <a href="../maquinas/maclim.html"><button class="btn-solucion">Limpieza</button></a>
      <a href="../maquinas/maqmar.html"><button class="btn-solucion">Marcado</button></a>
      <a href="../maquinas/macrobot.html"><button class="btn-solucion">Celdas robóticas</button></a>
      <a href="../manufactura/maqindus.html"><button class="btn-solucion">Manufactura</button></a>
    </div>
  </section>

  <!-- Sección de Ensamble -->
  <section class="ensamble">
    <h2>Soluciones de Maquinas de de Marcado</h2>
    
    <div class="tipo-maquina">
      <button class="btn-maquina active" data-target="automaticas">Marcado Laser</button>
      <button class="btn-maquina" data-target="semiautomaticas">Micropercusion</button> 
      <button class="btn-maquina" data-target="manuales">Inyeccion de tinta</button>
      <button class="btn-maquina" data-target="roboticas">Troquel</button>
    </div>

    <div class="carrusel-container">
      <!-- 1️⃣ Automáticas -->
      <div id="automaticas" class="carrusel-maquina">
        <div id="carouselAutomaticas" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="../../assets/images/general/img1.png" class="d-block w-100" alt="Automática 1"></div>
            <div class="carousel-item"><img src="../../assets/images/general/img1.png" class="d-block w-100" alt="Automática 2"></div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselAutomaticas" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselAutomaticas" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
        </div>
      </div>

      <!-- 2️⃣ Semiautomáticas -->
      <div id="semiautomaticas" class="carrusel-maquina d-none">
        <div id="carouselSemiautomaticas" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="../../assets/images/general/micro.jpg" class="d-block w-100" alt="Semiautomática 1"></div>
            <div class="carousel-item"><img src="../../assets/images/general/img2.png" class="d-block w-100" alt="Semiautomática 2"></div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselSemiautomaticas" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselSemiautomaticas" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
        </div>
      </div>

      <!-- 3️⃣ Manuales -->
      <div id="manuales" class="carrusel-maquina d-none">
        <div id="carouselManuales" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="../../assets/images/general/img3.png" class="d-block w-100" alt="Manual 1"></div>
            <div class="carousel-item"><img src="../../assets/images/general/img3.png" class="d-block w-100" alt="Manual 2"></div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselManuales" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselManuales" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
        </div>
      </div>

      <!-- 4️⃣ Robóticas -->
      <div id="roboticas" class="carrusel-maquina d-none">
        <div id="carouselRoboticas" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="../../assets/images/general/img1.png" class="d-block w-100" alt="Robótica 1"></div>
            <div class="carousel-item"><img src="../../assets/images/general/img1.png" class="d-block w-100" alt="Robótica 2"></div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselRoboticas" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselRoboticas" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
        </div>
      </div>

   

   


    </div>
  </section>

  <script src="../../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/components/header.js"></script>
  <script src="../../assets/js/components/footer.js"></script>

  <script>
    const botones = document.querySelectorAll('.btn-maquina');
    const carruseles = document.querySelectorAll('.carrusel-maquina');

    botones.forEach(btn => {
      btn.addEventListener('click', () => {
        botones.forEach(b => b.classList.remove('active'));
        carruseles.forEach(c => c.classList.add('d-none'));

        btn.classList.add('active');
        const target = document.getElementById(btn.dataset.target);
        target.classList.remove('d-none');
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensamble | DEMATIQ</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">

</head>
<body>

  <!-- Header inserted by JS -->

  <section class="page-hero">
    <div class="page-hero-inner">
      <p class="page-hero-tag">Manufactura</p>
      <h1>Maquinados Industriales</h1>
    </div>
  </section>

   <!-- Sección Soluciones -->
   <section class="seccion-soluciones">
    <h2>Soluciones y Servicios</h2>
    <div class="botones-soluciones">
      <a href="../servicios/servicios.html"><button class="btn-solucion">Servicios</button></a>
      <a href="../ensamble/ensamble.html"><button class="btn-solucion">Ensamble</button></a>
      <a href="../maquinas/maqcontrol.html"><button class="btn-solucion">Torque</button></a>
      <a href="../maquinas/maqprob.html"><button class="btn-solucion">Fuga</button></a>
      <a href="../maquinas/maqinspe.html"><button class="btn-solucion">Inspección</button></a>
      <a href="../maquinas/maclim.html"><button class="btn-solucion">Limpieza</button></a>
      <a href="../maquinas/maqmar.html"><button class="btn-solucion">Marcado</button></a>
      <a href="../maquinas/macrobot.html"><button class="btn-solucion">Celdas robóticas</button></a>
      <a href="../manufactura/maqindus.html"><button class="btn-solucion">Manufactura</button></a>
    </div>
  </section>

  <!-- Sección de Ensamble -->
  <section class="ensamble">
    <h2>Soluciones de Manufactura Maquinados Industriales</h2>
    
    <div class="tipo-maquina">
      <button class="btn-maquina active" data-target="automaticas">Diseño 2d y 3d dispositivos</button>
      <button class="btn-maquina" data-target="semiautomaticas">Diseño y fabricación de piezas mecanicas</button>
      <button class="btn-maquina" data-target="manuales">Diseño y fabricación de Fixture</button>
    </div>

    <div class="carrusel-container">

      <!-- Automáticas -->
      <div id="automaticas" class="carrusel-maquina">
        <div id="carouselAutomaticas" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="../../assets/images/general/maq.jpg" class="d-block w-100" alt="Automática 1">
            </div>
            <div class="carousel-item">
              <img src="../../assets/images/general/maq2.jpg" class="d-block w-100" alt="Automática 2">
            </div>
            <div class="carousel-item">
              <img src="../../assets/images/general/maq3.jpg" class="d-block w-100" alt="Automática 3">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselAutomaticas" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselAutomaticas" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>

      <!-- Semiautomáticas -->
      <div id="semiautomaticas" class="carrusel-maquina d-none">
        <div id="carouselSemiautomaticas" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="../../assets/images/general/maq.jpg" class="d-block w-100" alt="Semiautomática 1">
            </div>
            <div class="carousel-item">
              <img src="../../assets/images/general/maq2.jpg" class="d-block w-100" alt="Semiautomática 2">
            </div>
            <div class="carousel-item">
              <img src="../../assets/images/general/maq3.jpg" class="d-block w-100" alt="Semiautomática 3">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselSemiautomaticas" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselSemiautomaticas" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>

      <!-- Manuales -->
      <div id="manuales" class="carrusel-maquina d-none">
        <div id="carouselManuales" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="../../assets/images/general/img3.png" class="d-block w-100" alt="Manual 1">
            </div>
            <div class="carousel-item">
              <img src="../../assets/images/general/img3.png" class="d-block w-100" alt="Manual 2">
            </div>
            <div class="carousel-item">
              <img src="../../assets/images/general/img3.png" class="d-block w-100" alt="Manual 3">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselManuales" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselManuales" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/components/header.js"></script>
  <script src="../../assets/js/components/footer.js"></script>

  <script>
    const botones = document.querySelectorAll('.btn-maquina');
    const carruseles = document.querySelectorAll('.carrusel-maquina');

    botones.forEach(btn => {
      btn.addEventListener('click', () => {
        // quitar color activo
        botones.forEach(b => b.classList.remove('active'));
        carruseles.forEach(c => c.classList.add('d-none'));

        // activar el botón y el carrusel seleccionado
        btn.classList.add('active');
        const target = document.getElementById(btn.dataset.target);
        target.classList.remove('d-none');
      });
    });
  </script>

</body>
</html>

  <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/logos/favicon.ico">

  <!-- Sección de Ensamble -->
 <!-- Sección de Ensamble -->
<section class="ensamble">
  <h2>Soluciones de Ensamble e Ingeniería</h2>

  <div class="tipo-maquina">
    <button class="btn-maquina active" data-target="plc">Programación de PLC</button>
    <button class="btn-maquina" data-target="hmi">Programación de HMI, SCADA</button>
    <button class="btn-maquina" data-target="vision">Programación de Sistemas de Visión</button>
    <button class="btn-maquina" data-target="servo">Programación de Servomotores</button>
    <button class="btn-maquina" data-target="diagramas">Diseño de Diagramas Eléctricos</button>
    <button class="btn-maquina" data-target="tableros">Diseño de Tableros de Control</button>
    <button class="btn-maquina" data-target="modernizacion">Modernización de Maquinaria</button>
    <button class="btn-maquina" data-target="instalaciones">Servicio de Instalaciones Eléctricas</button>
    <button class="btn-maquina" data-target="ingenieria">Ingeniería Básica y de Detalle</button>
    <button class="btn-maquina" data-target="variadores">Programación de Variadores de Frecuencia</button>
  </div>

  <div class="carrusel-container">

    <!-- PLC -->
    <div id="plc" class="carrusel-maquina">
      <img src="../../assets/images/general/img1.webp" class="img-fluid" alt="Programación PLC">
    </div>

    <!-- HMI -->
    <div id="hmi" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img2.webp" class="img-fluid" alt="HMI SCADA">
    </div>

    <!-- Visión -->
    <div id="vision" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img3.webp" class="img-fluid" alt="Visión Artificial">
    </div>

    <!-- Servos -->
    <div id="servo" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img1.webp" class="img-fluid" alt="Servomotores">
    </div>

    <!-- Diagramas -->
    <div id="diagramas" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img2.webp" class="img-fluid" alt="Diagramas eléctricos">
    </div>

    <!-- Tableros -->
    <div id="tableros" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img3.webp" class="img-fluid" alt="Tableros de control">
    </div>

    <!-- Modernización -->
    <div id="modernizacion" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img1.webp" class="img-fluid" alt="Modernización">
    </div>

    <!-- Instalaciones -->
    <div id="instalaciones" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img2.webp" class="img-fluid" alt="Instalaciones eléctricas">
    </div>

    <!-- Ingeniería -->
    <div id="ingenieria" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img3.webp" class="img-fluid" alt="Ingeniería">
    </div>

    <!-- Variadores -->
    <div id="variadores" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img1.webp" class="img-fluid" alt="Variadores de frecuencia">
    </div>

  </div>
</section>


  <script src="../../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/components/header.js"></script>
  <script src="../../assets/js/components/footer.js"></script>

  <script>
    const botones = document.querySelectorAll('.btn-maquina');
    const carruseles = document.querySelectorAll('.carrusel-maquina');

    botones.forEach(btn => {
      btn.addEventListener('click', () => {
        botones.forEach(b => b.classList.remove('active'));
        carruseles.forEach(c => c.classList.add('d-none'));

        btn.classList.add('active');
        const target = document.getElementById(btn.dataset.target);
        target.classList.remove('d-none');
      });
    });
  </script>
</body>
</html>

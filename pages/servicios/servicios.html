<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensamble | DEMATIQ</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">

  <style>
    /* ====== Botones de Soluciones ====== */
    .seccion-soluciones {
      text-align: center;
      margin-top: 40px;
    }

    .botones-soluciones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn-solucion {
      background-color: #f8f9fa;
      border: 1px solid #ccc;
      padding: 10px 18px;
      border-radius: 6px;
      transition: all 0.3s;
    }

    .btn-solucion:hover {
      background-color: #007bff;
      color: #fff;
      border-color: #007bff;
    }

    /* ====== Sección Ensamble ====== */
    .ensamble {
      text-align: center;
      margin-top: 60px;
      padding-bottom: 60px;
    }

    .tipo-maquina {
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn-maquina {
      padding: 10px 20px;
      border: 1px solid #ccc;
      background-color: #f8f9fa;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-maquina:hover {
      background-color: #e2e6ea;
    }

    .btn-maquina.active {
      background-color: #007bff;
      color: #fff;
      border-color: #007bff;
    }

    .carousel-item img {
      max-height: 500px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="../../assets/images/logos/LOGO.png" alt="Logo DEMATIQ">
    </div>
    <nav>
      <ul>
        <li><a href="../../index.html">Inicio</a></li>
        <li><a href="../corporativo/nosotros.html">Sobre Nosotros</a></li>
        <li><a href="../corporativo/soluciones.html">Soluciones</a></li>
        <li><a href="../corporativo/industrias.html">Industrias</a></li>
        <li><a href="../corporativo/Contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

   <!-- Sección Soluciones -->
   <section class="seccion-soluciones">
    <h2>Soluciones y Servicios</h2>
    <div class="botones-soluciones">
      <a href="../servicios/servicios.html"><button class="btn-solucion">Servicios</button></a>
      <a href="../ensamble/ensamble.html"><button class="btn-solucion">Ensamble</button></a>
      <a href="../maquinas/maqcontrol.html"><button class="btn-solucion">Torque</button></a>
      <a href="../maquinas/maqprob.html"><button class="btn-solucion">Fuga</button></a>
      <a href="../maquinas/maqinspe.html"><button class="btn-solucion">Inspección</button></a>
      <a href="../maquinas/maclim.html"><button class="btn-solucion">Limpieza</button></a>
      <a href="../maquinas/maqmar.html"><button class="btn-solucion">Marcado</button></a>
      <a href="../maquinas/macrobot.html"><button class="btn-solucion">Celdas robóticas</button></a>
      <a href="../manufactura/maqindus.html"><button class="btn-solucion">Manufactura</button></a>
    </div>
  </section>

  <!-- Sección de Ensamble -->
 <!-- Sección de Ensamble -->
<section class="ensamble">
  <h2>Soluciones de Ensamble e Ingeniería</h2>

  <div class="tipo-maquina">
    <button class="btn-maquina active" data-target="plc">Programación de PLC</button>
    <button class="btn-maquina" data-target="hmi">Programación de HMI, SCADA</button>
    <button class="btn-maquina" data-target="vision">Programación de Sistemas de Visión</button>
    <button class="btn-maquina" data-target="servo">Programación de Servomotores</button>
    <button class="btn-maquina" data-target="diagramas">Diseño de Diagramas Eléctricos</button>
    <button class="btn-maquina" data-target="tableros">Diseño de Tableros de Control</button>
    <button class="btn-maquina" data-target="modernizacion">Modernización de Maquinaria</button>
    <button class="btn-maquina" data-target="instalaciones">Servicio de Instalaciones Eléctricas</button>
    <button class="btn-maquina" data-target="ingenieria">Ingeniería Básica y de Detalle</button>
    <button class="btn-maquina" data-target="variadores">Programación de Variadores de Frecuencia</button>
  </div>

  <div class="carrusel-container">

    <!-- PLC -->
    <div id="plc" class="carrusel-maquina">
      <img src="../../assets/images/general/img1.png" class="img-fluid" alt="Programación PLC">
    </div>

    <!-- HMI -->
    <div id="hmi" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img2.png" class="img-fluid" alt="HMI SCADA">
    </div>

    <!-- Visión -->
    <div id="vision" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img3.png" class="img-fluid" alt="Visión Artificial">
    </div>

    <!-- Servos -->
    <div id="servo" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img1.png" class="img-fluid" alt="Servomotores">
    </div>

    <!-- Diagramas -->
    <div id="diagramas" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img2.png" class="img-fluid" alt="Diagramas eléctricos">
    </div>

    <!-- Tableros -->
    <div id="tableros" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img3.png" class="img-fluid" alt="Tableros de control">
    </div>

    <!-- Modernización -->
    <div id="modernizacion" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img1.png" class="img-fluid" alt="Modernización">
    </div>

    <!-- Instalaciones -->
    <div id="instalaciones" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img2.png" class="img-fluid" alt="Instalaciones eléctricas">
    </div>

    <!-- Ingeniería -->
    <div id="ingenieria" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img3.png" class="img-fluid" alt="Ingeniería">
    </div>

    <!-- Variadores -->
    <div id="variadores" class="carrusel-maquina d-none">
      <img src="../../assets/images/general/img1.png" class="img-fluid" alt="Variadores de frecuencia">
    </div>

  </div>
</section>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/components/header.js"></script>
  <script src="../../assets/js/components/footer.js"></script>

  <script>
    const botones = document.querySelectorAll('.btn-maquina');
    const carruseles = document.querySelectorAll('.carrusel-maquina');

    botones.forEach(btn => {
      btn.addEventListener('click', () => {
        botones.forEach(b => b.classList.remove('active'));
        carruseles.forEach(c => c.classList.add('d-none'));

        btn.classList.add('active');
        const target = document.getElementById(btn.dataset.target);
        target.classList.remove('d-none');
      });
    });
  </script>
</body>
</html>
